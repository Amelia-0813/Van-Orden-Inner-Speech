<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Category Verification Study</title>

  <!-- jsPsych core + plugins -->
  <script src="https://unpkg.com/jspsych@8.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-instructions@2.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@2.2.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-select@2.1.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.1.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert@2.2.0"></script>
  <!-- DataPipe plugin (jsPsych-contrib) -->
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe@0.6.0"></script>
  <!-- CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/jspsych@8.0.0/css/jspsych.css">
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }
    .category-display {
      font-size: 40px;
      font-weight: bold;
      text-align: center;
      margin-top: 50px;
    }
    .word-display {
      font-size: 48px;
      font-weight: bold;
      text-align: center;
      margin-top: 50px;
    }
    .fixation {
      font-size: 40px;
      text-align: center;
      margin-top: 50px;
    }
    .fit-prompt-display {
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      max-width: 800px;
      margin: 80px auto 0;
      line-height: 1.5;
    }
    .fit-example-caption {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      max-width: 700px;
      margin: 0 auto 16px;
    }
    .fit-example-image {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .instructions-block {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 24px;
      box-sizing: border-box;
      text-align: center;
      font-size: 20px;
      line-height: 1.6;
    }
    .consent-block {
      max-width: 800px;
      margin: 0 auto;
      text-align: left;
      font-size: 18px;
      line-height: 1.6;
    }
    /* Make the jsPsych button-response buttons look like the "I Agree" / "I Do Not Agree" pair */
    .jspsych-btn {
      font-size: 16px;
      padding: 8px 20px;
      margin: 0 8px;
    }
    /* Setup pop-up shown before the experiment starts (replaces URL parameters) */
    #param-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    #param-overlay .param-box {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 360px;
      max-width: 90vw;
      padding: 28px 32px;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      font-size: 16px;
      line-height: 1.4;
    }
    #param-overlay h2 {
      margin: 0;
      font-size: 20px;
    }
    #param-overlay label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: bold;
    }
    #param-overlay label.param-check {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      font-weight: normal;
    }
    #param-overlay input[type="text"],
    #param-overlay select {
      font-size: 16px;
      padding: 8px;
    }
    #param-overlay button {
      margin-top: 4px;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    #param-overlay .param-error {
      color: #b30000;
      font-size: 14px;
      min-height: 1em;
    }
  </style>
</head>
<body></body>
<script src="experiment.js"></script>
</html>
